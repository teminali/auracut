<!DOCTYPE html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeminaliCut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Tag the platform before first paint so the titlebar reserves the
         right gutter — macOS needs room for the traffic lights, Windows
         and Linux do not. */
      (function () {
        var p = navigator.userAgent.indexOf('Mac') !== -1 ? 'mac'
              : navigator.userAgent.indexOf('Win') !== -1 ? 'win'
              : 'linux';
        document.documentElement.classList.add('platform-' + p);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
