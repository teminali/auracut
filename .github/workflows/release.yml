# ═══════════════════════════════════════════════════════════════════
# Release pipeline.
#
# Push a `v*` tag and this builds Kerf on each target OS and uploads
# the installers — plus the `latest*.yml` manifests electron-updater
# reads — to a single GitHub release. Cross-compiling is not an option:
# macOS artifacts must be produced on macOS, Windows on Windows.
#
# Pushing the tag IS the decision to ship: the moment all three jobs
# finish, the release is live and installed clients will see it on their
# next check. Tag only what you have actually run.
#
# THE RELEASE IS CREATED ONCE, BY `prepare`, BEFORE ANY BUILD RUNS.
# That job looks pointless and is not. electron-builder creates the
# GitHub release itself when it cannot find one, and three jobs starting
# at the same second all find nothing: on v1.3.0 the macOS and Windows
# jobs each logged `creating GitHub release reason=release doesn't exist`
# 100ms apart and GitHub made TWO release objects on the same tag. The
# tag then resolved to the one holding the Windows installer, so the
# release page offered macOS users no download at all while every macOS
# artifact sat on a release object nothing linked to. Both jobs reported
# success, because from each job's point of view it had uploaded
# everything it built.
# ═══════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release, once, before anything builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # From package.json rather than from the ref, because
          # `workflow_dispatch` runs on a BRANCH and GITHUB_REF_NAME
          # would be `main`. This is the same version electron-builder
          # will look for when it publishes.
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; the build jobs will upload into it"
          else
            gh release create "$tag" --title "${tag#v}" --generate-notes
          fi

          # ── Say which download is which, in words ──────────────────
          #
          # The artifact NAMES carry `arm64` / `x64` and deliberately do
          # not spell out "Apple Silicon" and "Intel": `parseFeed` in
          # electron/updater.ts selects the zip to sideload by matching
          # an architecture token, and that code is already baked into
          # every installed copy, so the tokens cannot change without
          # mis-targeting clients that exist today. See the comment
          # beside `artifactName` in electron-builder.yml.
          #
          # A person choosing a download reads this page, not the raw
          # filename, so the plain-English mapping lives here. Prepended
          # to the generated notes rather than replacing them.
          version="${tag#v}"
          guide=$(cat <<EOF
          ### Which download?

          | You have | Download |
          |---|---|
          | A Mac with Apple silicon (M1 and later) | \`Kerf-${version}-macOS-arm64.dmg\` |
          | A Mac with an Intel processor | \`Kerf-${version}-macOS-x64.dmg\` |
          | Windows | \`Kerf-Setup-${version}-Windows-x64.exe\` |
          | Linux | \`Kerf-${version}-Linux-x86_64.AppImage\` |

          Not sure which Mac you have: Apple menu -> About This Mac. The
          \`-mac.zip\` files are what the in-app updater downloads; you do
          not need them.

          ---

          EOF
          )
          # `sed` strips the heredoc's indentation, which is only there to
          # keep this readable inside the YAML block.
          guide=$(printf '%s\n' "$guide" | sed 's/^          //')
          body=$(gh release view "$tag" --json body -q .body)
          printf '%s\n%s\n' "$guide" "$body" > /tmp/notes.md
          gh release edit "$tag" --notes-file /tmp/notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # No step here installs X11 headers, and that is the point.
      # `npmRebuild: false` in electron-builder.yml stops the one native
      # module being compiled at all — it is N-API and ships prebuilt
      # binaries. Installing headers to fix the compile was the first fix
      # attempted and it was whack-a-mole: keysym.h, then Xrandr.h.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check and build
        run: yarn build

      # Signing is opt-in. The two macOS steps below are mutually exclusive
      # and must stay that way: a secret that does not exist is exposed as
      # an EMPTY STRING, not as an unset variable, and electron-builder
      # reads CSC_LINK="" as a certificate *path* — resolving it against the
      # project directory and failing with "<workspace> not a file". So the
      # unsigned build must never see the CSC_* variables at all.
      - name: Detect macOS signing credentials
        if: matrix.platform == 'mac'
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "signed=1" >> "$GITHUB_OUTPUT"
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No CSC_LINK secret — building macOS unsigned. This build will tell users it cannot self-update."
          fi

      - name: Build and publish (macOS, signed)
        if: matrix.platform == 'mac' && steps.signing.outputs.signed == '1'
        run: yarn electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the bundle by esbuild — this is what lets the shipped
          # app know it is allowed to update itself.
          KERF_SIGNED: '1'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build and publish (macOS, unsigned)
        if: matrix.platform == 'mac' && steps.signing.outputs.signed != '1'
        run: yarn electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERF_SIGNED: '0'
          # Stop electron-builder rummaging through the runner keychain for
          # an identity it will not find.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build and publish (Windows)
        if: matrix.platform == 'win'
        run: yarn electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (Linux)
        if: matrix.platform == 'linux'
        run: yarn electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
