# ═══════════════════════════════════════════════════════════════════
# Packaging.
#
# The `publish` block is what makes auto-update work: electron-builder
# uploads the installers AND the update manifests (latest.yml,
# latest-mac.yml) to the GitHub release, and electron-updater reads
# those same manifests at runtime. Both halves must point at the same
# repo or the app will never see a new version.
# ═══════════════════════════════════════════════════════════════════

appId: com.teminalicut.editor
productName: TeminaliCut
copyright: Copyright © 2026 TeminaliCut

directories:
  output: release
  buildResources: build

# ── Do not rebuild the one native module ───────────────────────────
#
# `uiohook-napi` is N-API, and N-API is ABI-stable across Node and
# Electron versions. That is the entire reason it ships prebuilt
# binaries for every platform Kerf targets: nobody should ever have to
# compile it.
#
# @electron/rebuild compiles it anyway, and on Linux that failed twice
# in a row on headers the runner does not carry — first `X11/keysym.h`,
# then `X11/extensions/Xrandr.h`. Installing them one at a time is
# whack-a-mole against a compile that should not be happening: the
# prebuilt `prebuilds/linux-x64/uiohook-napi.node` is already in the
# package, and `node-gyp-build` finds it at runtime.
#
# This is a blanket switch and there is exactly one native dependency
# for it to apply to. Anything added later that is NOT N-API will need
# this reconsidered rather than assumed.
npmRebuild: false

# Ad-hoc signs macOS builds that have no Developer ID, so they can run at all.
afterPack: build/afterPack.cjs

# Ship only what the app actually runs.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'
  # Everything else is bundled by esbuild, so node_modules is not shipped
  # — except this. `uiohook-napi` is a native binding: esbuild leaves it
  # external, so the real package has to be in the archive.
  #
  # The WHOLE package, including the prebuilt binaries for platforms this
  # build is not for. An earlier version narrowed that to
  # `prebuilds/${platform}-${arch}` and it did nothing: `asarUnpack`
  # below re-includes the lot, and `${platform}` is not a documented
  # macro in `files` anyway. Measured, the difference is 700KB inside a
  # 103MB disk image — and the failure modes are not symmetric. Shipping
  # a few binaries nobody loads costs nothing; a macro that silently
  # expands to nothing on a runner ships an app whose click capture is
  # missing, which degrades quietly to the cursor fallback and would take
  # somebody a long evening to find.
  - node_modules/uiohook-napi/**/*
  - node_modules/node-gyp-build/**/*

# Anything a SEPARATE PROCESS has to open has to exist as a real file.
# Paths inside app.asar are not spawnable and not readable — asar is a
# virtual filesystem that only Electron's patched `fs` understands, so to
# anyone else `app.asar` is a file and a path through it is "Not a
# directory".
#
#  - the MCP shim, because Claude Code spawns it;
#  - bundled audio and video, because ffmpeg reads them from the main
#    process. The starter project's music bed is one of these: it played
#    fine in the renderer and exported silent, because the renderer can
#    read inside the archive and ffmpeg cannot.
#
# Unpacking puts a copy under app.asar.unpacked; `ffmpegSource()` in
# electron/mediaPath.ts is what redirects the path to it.
asarUnpack:
  # A .node binary is dlopen'd by the OS loader, which does not understand
  # asar. Inside the archive it is a slice of one file and the load fails
  # with a path error that reads like a missing module.
  - node_modules/uiohook-napi/**
  - dist-electron/mcpStdio.cjs
  - dist/assets/*.{wav,mp3,m4a,aac,ogg,flac,opus,mp4,mov,webm,mkv,m4v}

publish:
  provider: github
  owner: teminali
  repo: frontierCut
  releaseType: release

# ── macOS ──────────────────────────────────────────────────────────
mac:
  category: public.app-category.video
  # Both targets are needed: `dmg` is what people download, `zip` is what
  # Squirrel.Mac downloads to perform an in-place update. Dropping the zip
  # is the most common reason macOS auto-update silently never fires.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  #
  # Every artifact says which platform AND which architecture it is.
  #
  # The default naming was `Kerf-1.5.0-arm64-mac.zip` for Apple Silicon
  # and `Kerf-1.5.0-mac.zip` for INTEL, so the Intel build was the one
  # that read as "the Mac one" and was the one an Apple Silicon user
  # would reach for. Verified with `lipo -archs` on the binaries rather
  # than trusted from the filenames, because the filenames were the
  # thing that was wrong.
  #
  # The arch token is `${arch}` and stays a literal `arm64` / `x64` on
  # purpose, rather than reading `AppleSilicon` / `Intel`:
  # `parseFeed` in electron/updater.ts picks the zip to sideload by
  # looking for the substring `arm64`, and that code is BAKED INTO
  # EVERY COPY ALREADY INSTALLED. Fixing the parser here only helps
  # future releases. Ship zips without an `arm64` token and every
  # installed Intel client takes "the zip that is not arm64", which
  # would now be the Apple Silicon one, and installs the wrong
  # architecture without saying anything.
  #
  # The plain-English mapping lives on the release page instead, which
  # is where somebody actually chooses a download. See the `prepare`
  # job in .github/workflows/release.yml.
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  darkModeSupport: true
  hardenedRuntime: true
  # macOS refuses a camera or microphone to a hardened-runtime app whose
  # Info.plist does not say what it wants them for, and the refusal is a
  # CRASH rather than a denied prompt. The screen recorder needs both.
  #
  # Screen capture itself has no usage-description key and no API to ask
  # with: it is granted in System Settings and takes effect on the next
  # launch. `recorder:requestPermission` opens that pane.
  extendInfo:
    NSCameraUsageDescription: >-
      Kerf records your camera alongside your screen while you are making a
      screen recording, and at no other time.
    NSMicrophoneUsageDescription: >-
      Kerf records your microphone alongside your screen while you are making a
      screen recording, and at no other time.
  # Applied only when a real identity signs; ad-hoc builds get the
  # entitlements too, which is what keeps V8's JIT working locally.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  #
  # `identity` is deliberately NOT set to null.
  #
  # Skipping the signing step leaves the bundle carrying Electron's own
  # stale linker signature, which no longer matches the modified contents.
  # Apple Silicon refuses to execute that: the app dies on launch with no
  # output and exit code 0. Leaving `identity` unset lets electron-builder
  # pick up CSC_LINK when CI provides it, and fall back to an ad-hoc
  # signature when it does not — which is enough to run locally.

dmg:
  artifactName: ${productName}-${version}-macOS-${arch}.${ext}
  # The MOUNTED VOLUME says the architecture too. The default title is
  # `${productName} ${version}`, which electron-builder suffixes with the
  # arch only for arm64 — so the Intel disk mounted as plain "Kerf 1.6.0"
  # and read as the ordinary one, which is the same asymmetry the file
  # names had. With both mounted at once they were "Kerf 1.6.0-arm64" and
  # "Kerf 1.6.0".
  title: ${productName} ${version} ${arch}
  # No `contents:` override. A `type: file` entry with no `path` makes
  # electron-builder try to stage the project directory itself and fail
  # with "not a file"; the default layout is already app-left,
  # Applications-right, which is all that was wanted.

# ── Windows ────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]
  # Windows has one target today. The architecture is in the name anyway,
  # because "no arch means x64" is a convention that stops being true the
  # day an arm64 target is added, and renaming artifacts later is the
  # thing that breaks updaters.
  artifactName: ${productName}-Setup-${version}-Windows-${arch}.${ext}

nsis:
  # A per-user install needs no elevation, which is also what lets the
  # updater replace the app without a UAC prompt on every release.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TeminaliCut

# ── Linux (AppImage rides along for free) ──────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo
  # `${arch}` renders `x86_64` here rather than `x64`, which is what
  # AppImage itself uses and what a Linux user expects to see. The
  # inconsistency with the Windows name is deliberate: each platform is
  # spelled the way that platform spells it.
  artifactName: ${productName}-${version}-Linux-${arch}.${ext}
