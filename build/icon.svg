<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Kerf</title>
  <defs>
    <linearGradient id="material" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#7ab0ff"/>
      <stop offset="0.5" stop-color="#4a90ff"/>
      <stop offset="1"   stop-color="#2a63cc"/>
    </linearGradient>
    <clipPath id="halfA"><polygon points="64.70,2666.20 1010.09,-1631.03 3158.71,-1158.34 2213.31,3138.90"/></clipPath>
    <clipPath id="halfB"><polygon points="13.91,2655.03 959.30,-1642.20 -1189.31,-2114.90 -2134.71,2182.34"/></clipPath>
    <!-- One block. The gradient is continuous across the gap, so the mark
         reads as a single piece of material that has been cut, not as two
         shapes that happen to sit near each other. -->
    <g id="block">
      <rect x="128" y="128" width="768" height="768" rx="176" fill="url(#material)"/>
    </g>
  </defs>
  <g clip-path="url(#halfA)"><use href="#block" transform="translate(13.67,3.01)"/></g>
  <g clip-path="url(#halfB)"><use href="#block" transform="translate(-13.67,-3.01)"/></g>
</svg>
