<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>TeminaliCut</title>
  <!-- `>_C` — the same construction as TeminaliCode's `>_<`
       (teminaliCode/studio/build/mark.svg): one black plate, three stroked
       glyphs, stroke 76, round caps and joins, no gradient and no glow.
       Scaled to 0.93 about the centre so the `C` has the room a curve needs
       where the sibling's `<` did not. -->
  <rect width="1024" height="1024" rx="184" ry="184" fill="#000000"/>
  <g fill="none" stroke="#65C466" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="201,397 306,512 201,627"/>
    <line x1="371" y1="627" x2="547" y2="627"/>
    <path d="M773 418 A115 115 0 1 0 773 606"/>
  </g>
</svg>
