<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>TeminaliCut</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="tcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" stroke="#232936" stroke-width="8"/>
  
  <!-- TC Monogram -->
  <g filter="url(#glow)" stroke="url(#tcGrad)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- T - Crossbar & Stem -->
    <path d="M 220 320 H 520" />
    <path d="M 370 320 V 740" />
    <!-- C - Geometric Monogram Arc -->
    <path d="M 804 380 C 760 300 640 300 580 370 C 530 430 530 630 580 690 C 640 760 760 760 804 680" />
  </g>
</svg>
